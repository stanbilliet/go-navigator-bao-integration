<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>GO! Navigator Demo</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/site.css">
</head>

<body class="bg-light">

    <div class="container py-5">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h1 class="mb-1">
                    GO! Navigator Demo
                </h1>

                <p class="text-muted mb-0">
                    Demo van de integratie met de GO! Navigator BaO Selector
                </p>
            </div>

            <button
                id="newAssignment"
                type="button"
                class="btn btn-primary">

                Nieuwe opdracht

            </button>

        </div>


        <!-- Assignment list -->
        <div class="card shadow-sm">

            <div class="card-header">
                Opdrachten
            </div>

            <div class="card-body p-0">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                        <tr>
                            <th>
                                Titel
                            </th>

                            <th style="width: 120px;">
                                Doelen
                            </th>

                            <th style="width: 150px;">
                            </th>
                        </tr>

                    </thead>

                    <tbody id="assignments">

                        <tr id="emptyAssignments">

                            <td
                                colspan="3"
                                class="text-center text-muted py-4">

                                Nog geen opdrachten.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- Assignment modal -->
    <div
        class="modal fade"
        id="assignmentModal"
        tabindex="-1"
        aria-labelledby="assignmentModalTitle"
        aria-hidden="true">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">


                <!-- Modal header -->
                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="assignmentModalTitle">

                        Nieuwe opdracht

                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Sluiten">
                    </button>

                </div>


                <!-- Modal body -->
                <div class="modal-body">


                    <!-- Assignment title -->
                    <div class="mb-4">

                        <label
                            for="assignmentTitle"
                            class="form-label">

                            Titel

                        </label>

                        <input
                            id="assignmentTitle"
                            type="text"
                            class="form-control"
                            placeholder="Geef de opdracht een titel">

                    </div>


                    <!-- Goals -->
                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <div>

                            <label class="form-label mb-0">
                                Leerplandoelen
                            </label>

                            <div class="form-text">
                                Selecteer één of meerdere doelen via GO! Navigator.
                            </div>

                        </div>

                        <button
                            id="selectGoals"
                            type="button"
                            class="btn btn-outline-primary">

                            Doelen selecteren

                        </button>

                    </div>


                    <!-- No goals selected -->
                    <div
                        id="noGoals"
                        class="alert alert-secondary mb-0">

                        Nog geen doelen geselecteerd.

                    </div>


                    <!-- Selected goal list -->
                    <ul
                        id="goalList"
                        class="list-group">
                    </ul>


                </div>


                <!-- Modal footer -->
                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Annuleren

                    </button>

                    <button
                        id="saveAssignment"
                        type="button"
                        class="btn btn-primary">

                        Opslaan

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Application -->
    <script
        type="module"
        src="./js/app.js">
    </script>

</body>

</html>
